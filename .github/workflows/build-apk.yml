name: 构建安卓APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 强制给gradlew添加执行权限
      - name: 赋予gradlew可执行权限
        run: |
          ls -la
          chmod +x ./gradlew

      - name: 编译打包APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传APK安装包
        uses: actions/upload-artifact@v4
        with:
          name: 动物计时器安装包
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
